<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת ניהול מו״גים - חמ״ל</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Heebo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 gap-4">
            <div>
                <h1 class="text-3xl font-black text-white flex items-center gap-3">
                    <span class="bg-blue-600 w-3 h-8 rounded-full inline-block"></span>
                    מערכת ניהול מו״גים - חמ״ל
                </h1>
                <p class="text-slate-400 text-sm mt-1">מעקב, סטטוסים, אישורים דינמיים ותיעדוף התראות בזמן אמת</p>
            </div>
            <div class="flex items-center gap-3 w-full md:w-auto">
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl font-bold shadow-lg transition flex items-center gap-2 justify-center cursor-pointer w-full md:w-auto">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
                    הוספת מו״ג חדש
                </button>
            </div>
        </header>

        <!-- Urgent Alert Banner -->
        <div id="urgentAlertBanner" class="hidden mb-8 bg-red-950/80 border-2 border-red-600 text-red-200 p-4 rounded-2xl shadow-lg flex items-center gap-4">
            <span class="text-3xl animate-bounce">🚨</span>
            <div>
                <h3 class="font-bold text-lg text-red-100">התראת חירום: מו״גים לקראת פקיעה (< 24 שעות) וטרם אושרו!</h3>
                <p id="urgentAlertText" class="text-sm text-red-300"></p>
            </div>
        </div>

        <!-- Filters & Search -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex items-center gap-3">
                <span class="text-slate-400">🔍</span>
                <input type="text" id="searchInput" oninput="renderMogs()" placeholder="חיפוש לפי שם מו״ג או דורש..." class="bg-transparent w-full text-white placeholder-slate-500 focus:outline-none">
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex items-center gap-3">
                <span class="text-slate-400">filter</span>
                <select id="statusFilter" onchange="renderMogs()" class="bg-slate-900 text-white w-full rounded-lg p-1 border border-slate-700 focus:outline-none">
                    <option value="all">כל הסטטוסים</option>
                    <option value="מאושר">מאושר סופית</option>
                    <option value="בהמתנה">בהמתנה / בטיפול</option>
                </select>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex items-center justify-between">
                <span class="text-slate-400 text-sm">סה״כ מו״גים במערכת:</span>
                <span id="totalCountBadge" class="bg-blue-900 text-blue-200 px-3 py-1 rounded-full font-bold text-sm">0</span>
            </div>
        </div>

        <!-- Mogs Grid -->
        <div id="mogsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Cards Here -->
        </div>
    </div>

    <!-- Modal for Add/Edit Mog -->
    <div id="mogModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-2xl rounded-2xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                <h2 id="modalTitle" class="text-xl font-bold text-white">הוספת מו״ג חדש</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl font-bold">✕</button>
            </div>
            
            <form id="mogForm" onsubmit="saveMog(event)" class="space-y-4">
                <input type="hidden" id="mogId">
                
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">שם המו״ג</label>
                    <input type="text" id="mogName" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500" placeholder="למשל: תקיפה מתוכננת בגזרה הצפונית">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">דורש</label>
                        <input type="text" id="mogRequester" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500" placeholder="למשל: רב״נ סרן כהן">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">מועד יעד (תאריך ושעה)</label>
                        <input type="datetime-local" id="mogDateTime" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">סטטוס אישור מו״ג כללי</label>
                    <select id="mogOverallStatus" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
                        <option value="בהמתנה">בהמתנה</option>
                        <option value="מאושר">מאושר</option>
                        <option value="לא מאושר">לא מאושר</option>
                    </select>
                </div>

                <!-- Approval Fields Builder -->
                <div class="border-t border-slate-700 pt-4">
                    <label class="block text-sm font-medium text-slate-300 mb-2">שדות אישורים דינמיים:</label>
                    <p class="text-xs text-slate-400 mb-3">בחר מהרשימה המהירה או הוסף שדה חופשי משלך:</p>
                    
                    <!-- Quick Buttons -->
                    <div class="flex flex-wrap gap-2 mb-3">
                        <button type="button" onclick="addApprovalField('חה״א')" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg text-slate-200">+ חה״א</button>
                        <button type="button" onclick="addApprovalField('חה״י')" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg text-slate-200">+ חה״י</button>
                        <button type="button" onclick="addApprovalField('חט״ה')" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg text-slate-200">+ חט״ה</button>
                        <button type="button" onclick="addApprovalField('פד״ם')" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg text-slate-200">+ פד״ם</button>
                        <button type="button" onclick="addApprovalField('פקמ״ז')" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg text-slate-200">+ פקמ״ז</button>
                        <button type="button" onclick="addApprovalField('פצ״ן')" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg text-slate-200">+ פצ״ן</button>
                        <button type="button" onclick="addApprovalField('שב״כ')" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg text-slate-200">+ שב״כ</button>
                    </div>

                    <!-- Custom Field Input -->
                    <div class="flex gap-2 mb-4">
                        <input type="text" id="customFieldName" placeholder="שם גורם נוסף חופשי..." class="bg-slate-900 border border-slate-700 rounded-xl p-2 text-sm text-white flex-1 focus:outline-none">
                        <button type="button" onclick="addCustomApprovalField()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl text-sm font-bold">הוסף שדה</button>
                    </div>

                    <!-- Dynamic Fields Container -->
                    <div id="approvalFieldsContainer" class="space-y-3 max-h-48 overflow-y-auto p-2 bg-slate-900/50 rounded-xl border border-slate-700">
                        <!-- Items populated via JS -->
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-700">
                    <button type="button" onclick="closeModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-5 py-2.5 rounded-xl font-bold">ביטול</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl font-bold shadow-lg">שמור מו״ג</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let mogs = JSON.parse(localStorage.getItem('mogs_data')) || [
            {
                id: '1',
                name: 'מו״ג מבצעי צפון',
                requester: 'אל״ם אורי',
                dateTime: '2026-11-18T08:00',
                overallStatus: 'בהמתנה',
                approvals: [
                    { name: 'חה״א', status: 'מאושר' },
                    { name: 'פצ״ן', status: 'בתיאום' },
                    { name: 'שב״כ', status: 'לא מאושר' }
                ]
            },
            {
                id: '2',
                name: 'מו״ג מבצעי דרום',
                requester: 'סא״ل דנה',
                dateTime: '2026-11-25T14:30',
                overallStatus: 'מאושר',
                approvals: [
                    { name: 'פד״ם', status: 'מאושר' },
                    { name: 'חה״י', status: 'מאושר' }
                ]
            }
        ];

        let currentModalFields = [];

        function saveToStorage() {
            localStorage.setItem('mogs_data', JSON.stringify(mogs));
        }

        function openModal(mogId = null) {
            currentModalFields = [];
            const modal = document.getElementById('mogModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            if (mogId) {
                document.getElementById('modalTitle').innerText = 'עריכת מו״ג';
                const mog = mogs.find(m => m.id === mogId);
                if (mog) {
                    document.getElementById('mogId').value = mog.id;
                    document.getElementById('mogName').value = mog.name;
                    document.getElementById('mogRequester').value = mog.requester;
                    document.getElementById('mogDateTime').value = mog.dateTime;
                    document.getElementById('mogOverallStatus').value = mog.overallStatus;
                    currentModalFields = JSON.parse(JSON.stringify(mog.approvals));
                }
            } else {
                document.getElementById('modalTitle').innerText = 'הוספת מו״ג חדש';
                document.getElementById('mogForm').reset();
                document.getElementById('mogId').value = '';
                // Default default fields for a new mog
                currentModalFields = [
                    { name: 'חה״א', status: 'בתיאום' },
                    { name: 'פצ״ן', status: 'בתיאום' }
                ];
            }
            renderModalApprovalFields();
        }

        function closeModal() {
            const modal = document.getElementById('mogModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function addApprovalField(name, status = 'בתיאום') {
            if (currentModalFields.some(f => f.name === name)) return;
            currentModalFields.push({ name, status });
            renderModalApprovalFields();
        }

        function addCustomApprovalField() {
            const input = document.getElementById('customFieldName');
            const name = input.value.trim();
            if (!name) return;
            addApprovalField(name, 'בתיאום');
            input.value = '';
        }

        function removeModalField(index) {
            currentModalFields.splice(index, 1);
            renderModalApprovalFields();
        }

        function updateModalFieldStatus(index, status) {
            currentModalFields[index].status = status;
        }

        function renderModalApprovalFields() {
            const container = document.getElementById('approvalFieldsContainer');
            container.innerHTML = '';
            if (currentModalFields.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-500 text-center py-2">אין שדות אישור מוגדרים</p>';
                return;
            }
            currentModalFields.forEach((field, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between bg-slate-800 p-2.5 rounded-lg border border-slate-700';
                div.innerHTML = `
                    <span class="text-sm font-bold text-white">${field.name}</span>
                    <div class="flex items-center gap-2">
                        <select onchange="updateModalFieldStatus(${index}, this.value)" class="bg-slate-900 text-xs text-white p-1.5 rounded-lg border border-slate-700 focus:outline-none">
                            <option value="בתיאום" ${field.status === 'בתיאום' ? 'selected' : ''}>בתיאום</option>
                            <option value="מאושר" ${field.status === 'מאושר' ? 'selected' : ''}>מאושר</option>
                            <option value="לא מאושר" ${field.status === 'לא מאושר' ? 'selected' : ''}>לא מאושר</option>
                        </select>
                        <button type="button" onclick="removeModalField(${index})" class="text-red-400 hover:text-red-300 text-sm px-1.5 font-bold">✕</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function saveMog(event) {
            event.preventDefault();
            const id = document.getElementById('mogId').value || Date.now().toString();
            const name = document.getElementById('mogName').value;
            const requester = document.getElementById('mogRequester').value;
            const dateTime = document.getElementById('mogDateTime').value;
            const overallStatus = document.getElementById('mogOverallStatus').value;

            const mogData = {
                id,
                name,
                requester,
                dateTime,
                overallStatus,
                approvals: currentModalFields
            };

            const index = mogs.findIndex(m => m.id === id);
            if (index !== -1) {
                mogs[index] = mogData;
            } else {
                mogs.push(mogData);
            }

            saveToStorage();
            closeModal();
            renderMogs();
        }

        function deleteMog(id) {
            if (confirm('האם למחוק מו״ג זה לצמיתות?')) {
                mogs = mogs.filter(m => m.id !== id);
                saveToStorage();
                renderMogs();
            }
        }

        function quickToggleApproval(mogId, approvalIndex, newStatus) {
            const mog = mogs.find(m => m.id === mogId);
            if (mog && mog.approvals[approvalIndex]) {
                mog.approvals[approvalIndex].status = newStatus;
                
                // Check if all approved -> automatically set overall status if needed
                const allApproved = mog.approvals.every(a => a.status === 'מאושר');
                if (allApproved && mog.overallStatus !== 'מאושר') {
                    mog.overallStatus = 'מאושר';
                }

                saveToStorage();
                renderMogs();
            }
        }

        function getPriorityScore(mog) {
            const now = new Date().getTime();
            const mogTime = new Date(mog.dateTime).getTime();
            const hoursLeft = (mogTime - now) / (1000 * 60 * 60);
            
            // Urgency weight: closer time = higher priority (smaller number for sorting)
            let score = mogTime;
            // If already passed or unapproved and very close, bump up
            return score;
        }

        function renderMogs() {
            const container = document.getElementById('mogsContainer');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            // Sort by datetime (earliest first - most urgent)
            let filtered = mogs.filter(mog => {
                const matchesSearch = mog.name.toLowerCase().includes(search) || mog.requester.toLowerCase().includes(search);
                const matchesStatus = statusFilter === 'all' || mog.overallStatus === statusFilter;
                return matchesSearch && matchesStatus;
            }).sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime));

            document.getElementById('totalCountBadge').innerText = mogs.length;

            // Check urgent < 24h unapproved
            const now = new Date().getTime();
            const urgentUnapproved = mogs.filter(m => {
                const timeDiff = new Date(m.dateTime).getTime() - now;
                const hoursLeft = timeDiff / (1000 * 60 * 60);
                return hoursLeft > 0 && hoursLeft < 24 && m.overallStatus !== 'מאושר';
            });

            const alertBanner = document.getElementById('urgentAlertBanner');
            if (urgentUnapproved.length > 0) {
                alertBanner.classList.remove('hidden');
                document.getElementById('urgentAlertText').innerText = `ישנם ${urgentUnapproved.length} מו״גים שמועדם בעוד פחות מ-24 שעות וטרם אושרו סופית: ` + urgentUnapproved.map(u => u.name).join(', ');
            } else {
                alertBanner.classList.add('hidden');
            }

            container.innerHTML = '';
            if (filtered.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500 bg-slate-800/50 rounded-2xl border border-slate-800">לא נמצאו מו״גים תואמים</div>';
                return;
            }

            filtered.forEach(mog => {
                const mogTime = new Date(mog.dateTime).getTime();
                const hoursLeft = (mogTime - now) / (1000 * 60 * 60);
                const isUrgent = hoursLeft > 0 && hoursLeft < 24 && mog.overallStatus !== 'מאושר';

                let overallBadgeColor = 'bg-yellow-950 text-yellow-300 border-yellow-800';
                if (mog.overallStatus === 'מאושר') overallBadgeColor = 'bg-emerald-950 text-emerald-300 border-emerald-800';
                if (mog.overallStatus === 'לא מאושר') overallBadgeColor = 'bg-red-950 text-red-300 border-red-800';

                const card = document.createElement('div');
                card.className = `bg-slate-800 rounded-2xl p-5 border shadow-xl flex flex-col justify-between transition relative ${isUrgent ? 'border-red-500 ring-2 ring-red-500/30' : 'border-slate-700'}`;

                let approvalsHtml = '';
                mog.approvals.forEach((app, idx) => {
                    let statusColor = 'text-yellow-400 bg-yellow-950/50';
                    if (app.status === 'מאושר') statusColor = 'text-emerald-400 bg-emerald-950/50';
                    if (app.status === 'לא מאושר') statusColor = 'text-red-400 bg-red-950/50';

                    approvalsHtml += `
                        <div class="flex items-center justify-between text-xs bg-slate-900/60 p-2 rounded-lg border border-slate-700/50">
                            <span class="font-medium text-slate-300">${app.name}</span>
                            <select onchange="quickToggleApproval('${mog.id}', ${idx}, this.value)" class="text-xs font-bold rounded px-2 py-1 border border-slate-700 ${statusColor} focus:outline-none cursor-pointer">
                                <option value="בתיאום" ${app.status === 'בתיאום' ? 'selected' : ''}>בתיאום</option>
                                <option value="מאושר" ${app.status === 'מאושר' ? 'selected' : ''}>מאושר</option>
                                <option value="לא מאושר" ${app.status === 'לא מאושר' ? 'selected' : ''}>לא מאושר</option>
                            </select>
                        </div>
                    `;
                });

                // Format nice date & time
                const formattedDate = new Date(mog.dateTime).toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' });

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <h3 class="text-lg font-bold text-white leading-snug">${mog.name}</h3>
                            <span class="px-2.5 py-1 rounded-full text-xs font-bold border ${overallBadgeColor} shrink-0">${mog.overallStatus}</span>
                        </div>
                        <div class="space-y-1.5 text-sm text-slate-400 mb-4">
                            <p class="flex items-center gap-2"><span class="text-slate-500">👤</span> דורש: <strong class="text-slate-200">${mog.requester}</strong></p>
                            <p class="flex items-center gap-2"><span class="text-slate-500">📅</span> מועד: <strong class="${isUrgent ? 'text-red-400 font-black animate-pulse' : 'text-slate-200'}">${formattedDate}</strong></p>
                        </div>
                        <div class="space-y-2 mb-4">
                            <p class="text-xs font-bold text-slate-400">סטטוס אישורים דינמיים:</p>
                            <div class="space-y-1.5 max-h-36 overflow-y-auto">
                                ${approvalsHtml || '<p class="text-xs text-slate-500">אין שדות אישור</p>'}
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-between items-center pt-3 border-t border-slate-700 mt-2">
                        <button onclick="openModal('${mog.id}')" class="text-blue-400 hover:text-blue-300 text-xs font-bold cursor-pointer">עריכה מלאה</button>
                        <button onclick="deleteMog('${mog.id}')" class="text-red-400 hover:text-red-300 text-xs font-bold cursor-pointer">מחיקה</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Initial render
        renderMogs();
    </script>
</body>
</html>
