<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת ניהול מו״גים - חמ״ל</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 20px; direction: rtl; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { background: #1e293b; border: 1px solid #334155; padding: 24px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        h1 { font-size: 24px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 12px; }
        h1 span.bar { background: #2563eb; width: 6px; height: 28px; border-radius: 4px; display: inline-block; }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-top: 4px; }
        button { cursor: pointer; border: none; font-family: inherit; transition: background 0.2s; }
        .btn-primary { background: #2563eb; color: #fff; padding: 10px 20px; border-radius: 12px; font-weight: bold; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
        .btn-primary:hover { background: #1d4ed8; }

        .alert-banner { background: #450a0a; border: 2px solid #dc2626; color: #fca5a5; padding: 16px; border-radius: 16px; margin-bottom: 24px; display: flex; align-items: center; gap: 16px; box-shadow: 0 4px 12px rgba(220,38,38,0.2); }
        .alert-banner.hidden { display: none; }

        .filters-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        @media(max-width: 768px) { .filters-grid { grid-template-columns: 1fr; } }
        .filter-box { background: #1e293b; border: 1px solid #334155; padding: 12px 16px; border-radius: 12px; display: flex; align-items: center; gap: 12px; }
        .filter-box input, .filter-box select { background: transparent; border: none; color: #fff; width: 100%; font-size: 14px; outline: none; }
        .filter-box select option { background: #0f172a; color: #fff; }

        .mogs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
        .mog-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); position: relative; }
        .mog-card.urgent { border-color: #ef4444; box-shadow: 0 0 15px rgba(239,68,68,0.25); }

        /* Overall Status Quick Select */
        .overall-select { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; border: 1px solid transparent; cursor: pointer; outline: none; transition: all 0.2s; }
        .overall-select option { background: #0f172a; color: #fff; font-weight: bold; }
        .status-waiting { background: #451a03; color: #fde047; border-color: #ca8a04; }
        .status-approved { background: #064e3b; color: #6ee7b7; border-color: #059669; }
        .status-denied { background: #450a0a; color: #fca5a5; border-color: #dc2626; }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 12px; }
        .card-title { font-size: 18px; font-weight: bold; color: #fff; }
        .card-info { font-size: 14px; color: #94a3b8; margin-bottom: 16px; line-height: 1.6; }
        .card-info strong { color: #e2e8f0; }

        /* Dynamic Approvals with Color Coding */
        .approvals-list { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 8px; margin-bottom: 16px; max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .approval-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 8px; border: 1px solid #334155; font-size: 12px; transition: all 0.2s; }
        .approval-row.row-waiting { background: rgba(69, 26, 3, 0.45); border-color: rgba(202, 138, 4, 0.4); }
        .approval-row.row-approved { background: rgba(6, 78, 59, 0.45); border-color: rgba(5, 150, 105, 0.4); }
        .approval-row.row-denied { background: rgba(69, 10, 10, 0.45); border-color: rgba(220, 38, 38, 0.4); }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: 6px; }
        .dot-waiting { background: #facc15; box-shadow: 0 0 6px #facc15; }
        .dot-approved { background: #34d399; box-shadow: 0 0 6px #34d399; }
        .dot-denied { background: #f87171; box-shadow: 0 0 6px #f87171; }

        .approval-select { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; outline: none; cursor: pointer; border: 1px solid transparent; }
        .approval-select option { background: #0f172a; color: #fff; }
        .sel-waiting { background: #451a03; color: #fde047; border-color: #a16207; }
        .sel-approved { background: #064e3b; color: #6ee7b7; border-color: #047857; }
        .sel-denied { background: #450a0a; color: #fca5a5; border-color: #b91c1c; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #334155; padding-top: 12px; margin-top: auto; }
        .btn-text-edit { color: #60a5fa; background: none; font-size: 13px; font-weight: bold; }
        .btn-text-edit:hover { text-decoration: underline; }
        .btn-text-delete { color: #f87171; background: none; font-size: 13px; font-weight: bold; }
        .btn-text-delete:hover { text-decoration: underline; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 16
